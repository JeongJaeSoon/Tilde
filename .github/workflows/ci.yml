name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          swift --version
      - name: Run test suites
        run: ./Tests/run.sh

  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build (Release, unsigned)
        run: |
          xcodebuild -project Tilde.xcodeproj -scheme Tilde -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Zip app for artifact
        # ditto preserves the bundle structure and executable bits, which a
        # bare directory upload loses.
        run: ditto -c -k --keepParent build/Build/Products/Release/Tilde.app Tilde.app.zip
      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Tilde-unsigned
          path: Tilde.app.zip
